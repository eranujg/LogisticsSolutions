spring:
  application:
    name: tms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------------------------------------------------------------------
# DEVELOPMENT ONLY. Both must be false in any shared or customer environment
# (and springdoc.api-docs.enabled / springdoc.swagger-ui.enabled set to false).
#   header-enabled: tenant and user come from X-Tenant-Id / X-User-Id headers
#                   (replaced by verified Keycloak/Cognito tokens later)
#   admin-api-enabled: /api/v1/platform/tenants (create tenants) without login
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    persist-authorization: true    # remembers the tenant id across page reloads
    tags-sorter: alpha
    operations-sorter: alpha
tms:
  security:
    jwt:
      # Keycloak realm from docker compose (--profile auth). In AWS: the Cognito user pool issuer.
      issuer-uri: http://localhost:8180/realms/tms
  tenancy:
    header-enabled: true
  platform:
    admin-api-enabled: true
