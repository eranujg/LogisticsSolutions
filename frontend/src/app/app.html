<main class="page">
  <h1>Transport Platform</h1>

  @if (info(); as info) {
    <dl class="info">
      <dt>Status</dt>
      <dd class="ok">Backend OK</dd>
      <dt>Application</dt>
      <dd>{{ info.app }}</dd>
      <dt>Database time</dt>
      <dd>{{ info.databaseTime }}</dd>
      <dt>Tenants</dt>
      <dd>{{ info.tenantCount }}</dd>
    </dl>
  } @else if (error(); as error) {
    <p class="error">{{ error }}</p>
  } @else {
    <p>Checking backend...</p>
  }
</main>
