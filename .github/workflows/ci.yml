name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan repository history
        run: ./gitleaks detect --source . --redact --verbose

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Testcontainers PostgreSQL)
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          lines = []
          for f in sorted(glob.glob('build/test-results/test/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                      body = ' '.join((fl.text or '').split())
                      causes = re.findall(r'Caused by: ([^\n]{0,400}?) at ', body)
                      lines.append('TEST ' + tc.get('classname', '') + '.' + tc.get('name', '') + ': '
                                   + (fl.get('message') or '')[:800] + ' || CAUSES: ' + ' | '.join(causes[-3:]))
          try:
              log = open('build.log', errors='replace').read().splitlines()
          except FileNotFoundError:
              log = []
          for i, l in enumerate(log):
              if re.search(r'\.java:\d+: error:|What went wrong', l):
                  lines.append('BUILD ' + l.strip() + ' ' + (log[i + 1].strip() if i + 1 < len(log) else ''))
          text = '%0A'.join(x.replace('%', '%25').replace('\r', '').replace('\n', ' ') for x in lines[:40])
          print('::error title=Backend failures::' + (text or 'see job log')[:60000])
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
